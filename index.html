<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spanish Reading Game</title>
  
  <!-- Andika Font -->
  <link href="https://fonts.googleapis.com/css2?family=Andika&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: white;
      font-family: 'Andika', sans-serif;
      text-align: center;
      user-select: none;
      margin-top: 20px;
    }
    canvas {
      border: 1px solid #ddd;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      margin-bottom: 15px;
      display: inline-block;
      max-width: 100%;
      height: auto; /* responsive */
    }
    select, button {
      font-size: 18px;
      padding: 5px 10px;
      margin: 5px;
    }
    #controls { margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Spanish Reading Game</h2>

  <select id="wordListSelect">
    <option value="" selected disabled>Select a list</option>
    <option value="cv">CV</option>
    <option value="cvc">CVC</option>
    <option value="cvcv">CVCV</option>
    <option value="inversas">Inversas</option>
    <option value="trabadas">Trabadas</option>
  </select>

  <div id="controls">
    <!-- NEW: audio button -->
    <button id="playAudio" disabled>🔊 Play Audio</button>
    <button id="prevWord">⟵ Prev</button>
    <button id="nextWord">Next ⟶</button>
  </div>

  <canvas id="wordCanvas" width="768" height="432"></canvas>

  <div id="recording-controls">
    <button id="startRecording">🎙 Start Recording</button>
    <button id="stopRecording" disabled>⏹ Stop Recording</button>
  </div>
  
  <div id="readyMessage" style="font-size: 24px; margin-top: 10px; color: #555;"></div>
  <div id="previewContainer"></div>

<script>
/* Ensure this exists before first draw (prevents early undefined crash) */
if (window.allowSliderDraw === undefined) {
  window.allowSliderDraw = true;
}

/* ==================== Original wiring + responsive scaling ==================== */
const canvas = document.getElementById("wordCanvas");
const ctx = canvas.getContext("2d");

let words = [], currentWordIndex = 0;
let sliderX = 0, isDragging = false, sliderStart, sliderEnd;
let letters = [];

const DPR = window.devicePixelRatio || 1;
const BASE_W = 768, BASE_H = 432, BASE_AR = BASE_H / BASE_W;

function resizeCanvas() {
  const maxWidth = 768;
  const width = Math.min(window.innerWidth * 0.95, maxWidth);
  const height = Math.round(width * BASE_AR);

  // CSS size
  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  // Backing store (crisp)
  canvas.width = Math.round(width * DPR);
  canvas.height = Math.round(height * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (words.length) {
    setupWord(words[currentWordIndex]); // recompute positions
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

window.addEventListener("resize", () => requestAnimationFrame(resizeCanvas));
window.addEventListener("orientationchange", () => requestAnimationFrame(resizeCanvas));
document.addEventListener("DOMContentLoaded", resizeCanvas);

/* ==================== UI & Data ==================== */
const playBtn = document.getElementById("playAudio");

document.getElementById("wordListSelect").addEventListener("change", loadWordList);
document.getElementById("nextWord").addEventListener("click", () => changeWord(1));
document.getElementById("prevWord").addEventListener("click", () => changeWord(-1));

// Play button handler
playBtn.addEventListener("click", () => {
  if (!words.length) return;
  playWordAudio(words[currentWordIndex]);
});

async function loadWordList() {
  const listName = document.getElementById("wordListSelect").value;
  const response = await fetch(`wordlists/${listName}.txt`);
  const data = await response.text();
  words = data.trim().split("\n").map(w => w.trim()).sort(() => Math.random() - 0.5);
  currentWordIndex = 0;

  document.fonts.ready.then(() => {
    setupWord(words[currentWordIndex]);
    playBtn.disabled = false;
  });
}

function changeWord(direction) {
  if (!words.length) return;
  currentWordIndex = (currentWordIndex + direction + words.length) % words.length;
  document.fonts.ready.then(() => {
    setupWord(words[currentWordIndex]);
    playBtn.disabled = false;
  });
}

/* ==================== Layout & Drawing ==================== */
function setupWord(word) {
  // Scale font based on current CSS width
  const baseFont = 80;
  const scaledFont = Math.round(baseFont * (canvas.clientWidth / 768));
  const fontPx = Math.max(36, Math.min(96, scaledFont));
  ctx.font = `bold ${fontPx}px Andika`;

  letters = parseWord(word);

  // compute per-letter pill widths with a floor for narrow glyphs
  const padding = 10;
  const em = fontPx;                             // 1em in px
  const minPill = Math.max(18, em * 0.55);       // keeps 'l/i' pills decent
  const innerPad = Math.max(4, Math.round(em * 0.06));

  letters.forEach(l => {
    const gw = ctx.measureText(l.text).width;
    l.gw = gw;
    l.w  = Math.max(gw + innerPad * 2, minPill);
  });

  const totalWidth = letters.reduce((s, l) => s + l.w, 0) + padding * (letters.length - 1);

  sliderStart = (canvas.clientWidth - totalWidth) / 2;
  sliderEnd   = sliderStart + totalWidth;

  sliderX = sliderStart; // Start at left
  drawCanvas();
}

function parseWord(word) {
  const digraphs = ["ch", "ll", "rr", "qu"];
  const letters = [];
  for (let i = 0; i < word.length;) {
    let digraph = digraphs.find(d => word.startsWith(d, i));
    if (digraph) {
      letters.push({text: digraph, soundType: getSoundType(digraph)});
      i += digraph.length;
    } else {
      letters.push({text: word[i], soundType: getSoundType(word[i], word[i+1])});
      i++;
    }
  }
  return letters;
}

function getSoundType(letter, nextLetter = "") {
  if (letter === "c") return /[ei]/.test(nextLetter) ? "continuous" : "stop";
  if (["p","t","k","b","d","g","ch"].includes(letter)) return "stop";
  if (letter === "h") return "silent";
  return "continuous";
}

function drawCanvas() {
  if (!window.allowSliderDraw) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Re-apply font scaling for current size
  const baseFont = 80;
  const scaledFont = Math.round(baseFont * (canvas.clientWidth / 768));
  const fontPx = Math.max(36, Math.min(96, scaledFont));
  ctx.font = `bold ${fontPx}px Andika`;
  ctx.textAlign = "center";

  const padding = 10;
  const pillH = Math.max(16, Math.round(fontPx * 0.25));   // pill height tied to font size
  const textY = Math.round(fontPx * 1.25);                  // letters baseline
  const pillY = textY + Math.max(16, Math.round(fontPx * 0.5)); // pills under letters

  function pillRadius(w, h) {
    return Math.max(2, Math.min(10, h / 2, w / 2 - 1));
  }

  let x = sliderStart;

  letters.forEach(letter => {
    const pillW = letter.w;

    // Letter color based on progress
    ctx.fillStyle = (sliderX >= x + 1) ? "black" : "lightgrey";
    if (letter.text === "h" && letter.soundType === "silent") ctx.fillStyle = "#ccc";

    // Center text within the pill width
    ctx.fillText(letter.text, x + pillW / 2, textY);

    // Pill stroke/fill
    ctx.strokeStyle = letter.soundType === "silent" ? "#aaa"
                     : letter.soundType === "stop" ? "red" : "green";
    ctx.lineWidth = 3;
    ctx.fillStyle = (sliderX >= x + 1) ? ctx.strokeStyle : "white";

    const r = pillRadius(pillW, pillH);
    roundRect(x, pillY, pillW, pillH, r, true, true);

    x += pillW + padding;
  });

  // Slider line
  const lineY = pillY + pillH + Math.max(16, Math.round(fontPx * 0.25));
  ctx.lineCap = "round";
  ctx.strokeStyle = "#ccc";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(sliderStart, lineY);
  ctx.lineTo(sliderEnd, lineY);
  ctx.stroke();

  // Active segment
  ctx.strokeStyle = "#007bff";
  ctx.beginPath();
  ctx.moveTo(sliderStart, lineY);
  ctx.lineTo(sliderX, lineY);
  ctx.stroke();

  // Thumb
  ctx.beginPath();
  ctx.fillStyle = "#007bff";
  ctx.arc(sliderX, lineY, 10, 0, Math.PI * 2);
  ctx.fill();
}

canvas.addEventListener("pointerdown", (e)=> {isDragging=true; moveSlider(e);});
canvas.addEventListener("pointermove", (e)=> {if(isDragging){moveSlider(e);}});
canvas.addEventListener("pointerup", ()=>isDragging=false);
canvas.addEventListener("pointerleave", ()=>isDragging=false);

function moveSlider(e){
  const rect = canvas.getBoundingClientRect();
  sliderX = Math.min(Math.max(e.clientX - rect.left, sliderStart), sliderEnd);
  drawCanvas();
}

// Corner-safe rounded rect
function roundRect(x, y, w, h, r, fill, stroke) {
  r = Math.max(0, Math.min(r, w/2, h/2));
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

/* ==================== AUDIO: whole-word with fallback to first unit ==================== */
function normalizeName(s) {
  return s
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // strip accents
    .replace(/[^a-zñü]+/g, ''); // keep common spanish letters if you have them
}

function firstUnitOf(word) {
  const units = parseWord(word);
  return units && units.length ? units[0].text.toLowerCase() : '';
}

function playWordAudio(word) {
  const wordNorm = normalizeName(word);
  const unit = firstUnitOf(word);
  const unitNorm = normalizeName(unit);

  // Adjust these paths if your files live elsewhere
  const candidates = [
    `audio/words/${wordNorm}.mp3`,
    `audio/words/${wordNorm}.wav`,
    `audio/syll/${unitNorm}.mp3`,
    `audio/syll/${unitNorm}.wav`,
  ];

  const btn = playBtn;
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = '🔊 Reproduciendo…';

  let i = 0;
  const tryNext = () => {
    if (i >= candidates.length) {
      btn.disabled = false;
      btn.textContent = label;
      console.warn('No audio found for:', word, candidates);
      return;
    }
    const src = candidates[i++];
    const a = new Audio(src);
    a.playsInline = true;
    a.onended = () => { btn.disabled = false; btn.textContent = label; };
    a.onerror = () => tryNext();
    const p = a.play();
    if (p && typeof p.then === 'function') {
      p.catch(() => tryNext());
    }
  };
  tryNext();
}
</script>

<script src="https://cdn.webrtc-experiment.com/RecordRTC.js"></script>

<!-- Your original recording scripts (kept) -->
<script>
let recorder, stream;           // keep global allowSliderDraw set above
window.allowSliderDraw = true;

const startBtn = document.getElementById("startRecording");
const stopBtn = document.getElementById("stopRecording");
const previewContainer = document.getElementById("previewContainer");

startBtn.onclick = async () => {
  startBtn.disabled = true;
  stopBtn.disabled = false;
  previewContainer.innerHTML = "";

  const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const canvasStream = canvas.captureStream(30);
  const combinedStream = new MediaStream([
    ...canvasStream.getVideoTracks(),
    ...audioStream.getAudioTracks()
  ]);

  recorder = RecordRTC(combinedStream, {
    type: 'video',
    mimeType: 'video/webm',
    disableLogs: true
  });

  const readyText = document.getElementById("readyMessage");
  readyText.textContent = "🎬 Get ready...";

  setTimeout(() => {
    recorder.startRecording();
    readyText.textContent = "";
    window.allowSliderDraw = false;
    setTimeout(() => {
      window.allowSliderDraw = true;
      drawCanvas();
    }, 200);
  }, 600);
};

stopBtn.onclick = () => {
  stopBtn.disabled = true;
  startBtn.disabled = false;
  recorder.stopRecording(() => {
    const blob = recorder.getBlob();
    const videoURL = URL.createObjectURL(blob);
    const video = document.createElement("video");
    video.src = videoURL;
    video.controls = true;
    video.style.maxWidth = "100%";
    previewContainer.innerHTML = "";
    previewContainer.appendChild(video);
    stream?.getTracks().forEach(t => t.stop());
  });
};
</script>

</body>
</html>
